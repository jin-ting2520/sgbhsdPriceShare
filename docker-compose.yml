# 三国冰河时代富甲天下跑商价格分享 —— Docker Compose 一键部署
# 用法：docker compose up -d --build
#       或直接执行 ./deploy.sh（Linux/macOS） / .\deploy.ps1（Windows）
# 首次启动会自动创建 MySQL 库表与种子数据；如需导入旧 SQLite 数据：
#   docker compose exec app npm run db:migrate

services:
  mysql:
    image: mysql:8.4
    container_name: sgbhsd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sgbhsd_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sgbhsd}
      MYSQL_USER: ${MYSQL_USER:-sgbhsd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sgbhsd_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 供 deploy.sh / deploy.ps1 在容器内直接写 mysqldump 备份
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sgbhsd-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  app:
    build: .
    image: sgbhsd-price-share:latest
    container_name: sgbhsd-price-share
    restart: unless-stopped
    # 宿主机端口可用 PORT 环境变量覆盖：PORT=8080 docker compose up -d
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sgbhsd}
      MYSQL_USER: ${MYSQL_USER:-sgbhsd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sgbhsd_pass}
      REDIS_URL: redis://redis:6379
      HISTORY_LIMIT: ${HISTORY_LIMIT:-20000}
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-19981216.cao}
      ADMIN_TOKEN_HOURS: ${ADMIN_TOKEN_HOURS:-168}
    volumes:
      # SQLite 旧库/兜底库与迁移源（容器内 /app/data/price.db）
      - /root/data:/app/data
      # 备份目录（部署脚本备份的数据库会落在这里）
      - /root/backup:/app/backup

volumes:
  mysql-data:
  redis-data:

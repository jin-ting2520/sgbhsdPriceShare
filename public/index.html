<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9e2b25">
  <title>三国冰河时代富甲天下跑商价格分享</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>[v-cloak]{display:none}</style>
  <script type="importmap">
  {
    "imports": {
      "vue": "/vendor/vue/vue.esm-browser.prod.js",
      "element-plus": "/vendor/element-plus/index.full.min.mjs",
      "element-plus/locale/zh-cn": "/vendor/element-plus/locale/zh-cn.min.mjs"
    }
  }
  </script>
</head>

<body>
<div id="app" v-cloak>

  <!-- ================= 账号入口 ================= -->
  <div v-if="!entered" class="login-page">
    <div class="login-card">
      <div class="login-logo">价</div>
      <div class="login-title">三国冰河时代富甲天下跑商价格分享</div>
<el-input v-model="nicknameInput" placeholder="输入你的三国冰河时代昵称" size="large"
        maxlength="20" show-word-limit clearable @keyup.enter="enterSite"></el-input>
      <el-input v-model="passwordInput" type="password" show-password placeholder="密码（首次登录将自动注册）"
        size="large" style="margin-top:10px" maxlength="64" @keyup.enter="enterSite"></el-input>
      <el-button type="primary" size="large" style="width:100%;margin-top:14px"
        :loading="entering" @click="enterSite">进 入</el-button>
      <p class="login-hint">
        首次使用：输入昵称和自定义密码即自动注册，无其他权限区分。<br>
        昵称用于价格「更新人」，密码仅用于本机账号登录；游戏同步 token 各账号独立保存、互不可见。
      </p>
    </div>
  </div>

  <!-- ================= 主界面 ================= -->
  <template v-else>

  <header class="topbar">
    <div class="brand">
      <div class="logo">价</div>
      <div>
        <div class="title">三国冰河时代富甲天下跑商价格分享</div>
        <div class="subtitle">城池 · 商品 买卖价格录入 / 查询 / 实时共享</div>
      </div>
    </div>
    <div class="spacer"></div>
    <el-tooltip :content="wsConnected ? `实时协作已连接（在线 ${wsClients} 人）` : '实时协作未连接，正在重连…'">
      <span class="ws-pill">
        <span class="ws-dot" :class="{ on: wsConnected }"></span>
        <span class="ws-text">实时</span>
      </span>
    </el-tooltip>
    <div class="tools">
      <el-button size="small" type="primary" plain @click="openSync">同步</el-button>
      <el-button size="small" @click="openReports">报表</el-button>
      <el-button size="small" @click="openSettings">定时</el-button>
      <el-button size="small" @click="openDict">字典</el-button>
      <el-button size="small" @click="openHistory">日志</el-button>
      <el-button size="small" @click="openTrend">趋势</el-button>
      <el-button size="small" @click="openMatrix">比价</el-button>
      <el-button size="small" @click="openImport">导入</el-button>
      <el-button size="small" @click="exportCsv">导出</el-button>
      <el-button size="small" style="margin-left:4px" @click="switchAccount">
        {{ nickname }} <span style="font-size:10px;color:#999">切换账号</span>
      </el-button>
    </div>
  </header>

  <main class="container stack">

    <!-- ================= 搜索区 ================= -->
    <el-card class="search-card" shadow="never">
      <el-form :model="form" label-position="top" @submit.prevent>
        <el-row :gutter="14">
          <el-col :xs="24" :sm="8">
            <el-form-item>
              <template #label><span class="req-star">区服</span>（必填）</template>
<el-autocomplete :model-value="form.server" :fetch-suggestions="searchServers"
                placeholder="纯数字，如 1344" clearable style="width:100%"
                @update:model-value="v => form.server = String(v).replace(/\D/g, '')"
                @keyup.enter="onQuery"></el-autocomplete>
            </el-form-item>
          </el-col>
          <el-col :xs="24" :sm="8">
            <el-form-item>
              <template #label><span class="req-star">城池</span>（必选，可输入新名称后回车新增）</template>
              <el-select ref="citySelect" v-model="form.city" filterable clearable
                allow-create default-first-option placeholder="请选择城池" style="width:100%"
                @change="onDictChange('city', $event)">
<el-option v-for="c in cities" :key="c.id" :label="c.name" :value="c.name"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :xs="24" :sm="8">
            <el-form-item>
              <template #label>商品（可选，留空展示全部商品）</template>
              <el-select ref="commoditySelect" v-model="form.commodity" filterable clearable
                allow-create default-first-option placeholder="全部商品（可输入新名称后回车新增）"
                style="width:100%" @change="onDictChange('commodity', $event)">
                <el-option v-for="c in commodities" :key="c.id" :label="c.name" :value="c.name">
                  <span>{{ c.name }}</span>
                  <span v-if="c.burden != null" style="color:#999;font-size:12px;margin-left:6px">负重 {{ c.burden }}</span>
                </el-option>
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
        <div class="search-actions">
          <el-button type="primary" :loading="loading" @click="onQuery">查 询</el-button>
          <el-button @click="onReset">重 置</el-button>
        </div>
        <div class="relief-row">
          <el-tooltip content="商队第三辆车夫「赋税减免」技能，默认 5%，随账号保存；价格按你的减免实时换算"
            placement="top">
            <span class="relief-label">我的赋税减免</span>
          </el-tooltip>
          <el-input-number v-model="taxRelief" :min="0" :max="100" :step="1" size="small"
            controls-position="right" style="width:96px" @change="onReliefChange"></el-input-number>
          <span>%</span>
          <span v-if="queried && currentTax != null" class="relief-tax">
            （该城赋税 {{ Math.round(currentTax * 100) }}%）
          </span>
        </div>
        <p style="margin:10px 0 0;font-size:12px;color:var(--ink-2);line-height:1.7">
          提示：城池 / 商品数据来自字典表，输入新名称后按 <b>Enter</b> 或点「保存」即可写入字典；
          利润在「比价」中按（卖出城卖价 − 买入城买价）÷ 负重跨城计算，负重可在「字典」中维护。
        </p>
      </el-form>
    </el-card>

    <!-- ================= 价格表 ================= -->
    <el-card shadow="never">
      <template #header>
        <div class="table-card__head">
          <div class="scope" v-if="queried">
            <span class="tag">{{ form.server }}</span>
            <span class="tag">{{ form.city }}</span>
            <span style="font-weight:600">价格表</span>
          </div>
          <div class="scope" v-else style="color:var(--ink-2)">价格表（选择区服与城池后可查询录入）</div>
          <div class="spacer"></div>
          <el-tooltip :disabled="changedCount > 0" content="暂无修改内容">
            <el-button type="primary" :disabled="!canSave" @click="onSave">保 存</el-button>
          </el-tooltip>
        </div>
      </template>

      <!-- 统计条 -->
      <div class="statusbar" style="margin-bottom:12px">
        <span>商品 <b>{{ rows.length }}</b> 项</span>
        <span>已填写 <b class="ok">{{ stats.filled }}</b> 项</span>
        <span>待保存 <b :class="changedCount ? 'danger' : ''">{{ changedCount }}</b> 项</span>
        <span v-if="!queried" style="margin-left:auto">区服、城池、买价、卖价显示 “-”，选择后即可录入</span>
      </div>

      <el-alert v-if="conflictCount" type="warning" :closable="false" show-icon style="margin-bottom:10px"
        :title="`有 ${conflictCount} 项价格已被他人更新，你本地有未保存修改；保存时会提示冲突，可覆盖或改用最新数据`"></el-alert>

      <!-- 桌面端：表格 -->
      <el-table class="desktop-table" :data="rows" size="default" border stripe
        style="width:100%" :row-class-name="rowClass">
        <el-table-column label="区服" width="100" align="center">
          <template #default>{{ queried ? form.server : '-' }}</template>
        </el-table-column>
        <el-table-column label="城池" width="100" align="center">
          <template #default>{{ queried ? form.city : '-' }}</template>
        </el-table-column>
        <el-table-column label="商品" min-width="190">
          <template #default="scope">
            <div class="commodity-cell">
              <span class="name">
                {{ scope.row.commodity }}
                <span class="burden-tag" v-if="scope.row.burden != null">负重{{ scope.row.burden }}</span>
                <span v-if="isDirty(scope.row)" class="dirty-dot">*</span>
                <el-tag v-if="scope.row._remoteConflict" size="small" type="warning" effect="plain"
                  style="margin-left:6px">已被他人更新</el-tag>
              </span>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="买价" width="130">
          <template #default="scope">
            <span v-if="!queried">-</span>
            <div v-else class="price-input">
<el-input :model-value="scope.row.buy" placeholder="买价" inputmode="decimal" size="small"
            @input="onPriceInput(scope.row, 'buy', $event)"
            @blur="onPriceBlur(scope.row, 'buy')"></el-input>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="卖价" width="130">
          <template #default="scope">
            <span v-if="!queried">-</span>
            <div v-else class="price-input">
<el-input :model-value="scope.row.sell" placeholder="卖价" inputmode="decimal" size="small"
            @input="onPriceInput(scope.row, 'sell', $event)"
            @blur="onPriceBlur(scope.row, 'sell')"></el-input>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="更新时间" width="150" align="center">
          <template #default="scope">
            <span class="meta-cell">{{ scope.row.updatedAt || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="更新人" width="90" align="center">
          <template #default="scope">
            <span class="meta-cell">{{ scope.row.operator || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="快捷" width="86" align="center" v-if="queried">
          <template #default="scope">
            <el-button link type="primary" size="small" :disabled="scope.$index === 0"
              @click="copyPrev(scope.$index)">同上一行</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 手机端：卡片列表 -->
      <div class="mobile-cards" v-if="isMobile">
        <div class="m-row" v-for="(row, i) in rows" :key="row.commodityId"
          :class="{ dirty: isDirty(row), conflict: row._remoteConflict }">
          <div class="m-row__head">
            <span class="name">
              {{ row.commodity }}
              <span class="burden-tag" v-if="row.burden != null">负重{{ row.burden }}</span>
              <span v-if="isDirty(row)" class="dirty-dot">*</span>
              <el-tag v-if="row._remoteConflict" size="small" type="warning" effect="plain"
                style="margin-left:6px">已被他人更新</el-tag>
            </span>
            <span class="time" v-if="row.updatedAt && queried">{{ row.updatedAt.slice(5, 16) }}</span>
            <span class="time" v-else-if="!queried">-</span>
          </div>
          <div class="m-row__inputs" v-if="queried">
            <div>
              <div class="field-label">买价</div>
<el-input :model-value="row.buy" placeholder="买价" inputmode="decimal"
                @input="onPriceInput(row, 'buy', $event)" @blur="onPriceBlur(row, 'buy')"></el-input>
            </div>
            <div>
              <div class="field-label">卖价</div>
<el-input :model-value="row.sell" placeholder="卖价" inputmode="decimal"
                @input="onPriceInput(row, 'sell', $event)" @blur="onPriceBlur(row, 'sell')"></el-input>
            </div>
          </div>
          <div class="m-row__inputs" v-else>
            <div><div class="field-label">买价</div><div style="padding:6px 2px;color:var(--ink-2)">-</div></div>
            <div><div class="field-label">卖价</div><div style="padding:6px 2px;color:var(--ink-2)">-</div></div>
          </div>
          <div class="m-row__meta" v-if="queried">
            <span v-if="row.operator">更新人 {{ row.operator }}</span>
            <span v-else>未录入</span>
          </div>
          <div class="m-row__ops" v-if="queried">
            <button :disabled="i === 0" @click="copyPrev(i)">同上一行</button>
            <button @click="clearRow(row)">清空本行</button>
          </div>
        </div>
      </div>
    </el-card>

    <!-- ================= 操作说明 ================= -->
    <el-card id="help-card" shadow="never">
      <template #header><b style="font-size:14px">操作说明</b></template>
      <ol class="help-steps">
        <li><b>输入账号</b>：进入页面输入昵称与自定义密码（首次自动注册，密码至少 4 位）；登录会话缓存在本机，刷新无需重复输入。</li>
        <li><b>选择区服</b>：输入纯数字区服编号（如 1344），支持历史联想。</li>
        <li><b>选择城池</b>：必选项，下拉搜索；输入新城池名称按 <b>Enter</b> 即可写入字典表。</li>
        <li><b>选择商品</b>：可选项，留空时商品列固定展示全部商品；下拉项显示每个商品的负重。</li>
        <li><b>点击查询</b>：区服与城池填充进列表，买价/卖价/更新时间/更新人从数据库带出，查不到价格显示 “-”。</li>
        <li><b>填写价格</b>：直接在买价/卖价输入框录入；支持「同上一行」；他人同时改价会实时提示并标记冲突。</li>
        <li><b>点击保存</b>：右上角「保存」→ 弹窗确认变更明细 → 确认后写入数据库，记录更新时间与更新人。</li>
        <li><b>字典管理</b>：「字典」可新增/改名/维护负重/启停/删除城池与商品；被价格引用的项不可删除。</li>
      </ol>
      <div class="help-grid">
        <div class="help-item">
          <h4>游戏直连同步</h4>
          <p>点「同步」粘贴游戏登录 token（网页端 localStorage 的 x-game-token-pcweb），即可通过官方接口实时抓取全服 175 城价格，无需截图逐条录入；token 保存在当前账号下（其他账号不可见）并可留空复用。数据库存税前原价与各城税率，页面按「我的赋税减免」实时换算（卖出=原价−赋税，买入=原价+赋税），每城仅 3 个商品可买入。</p>
        </div>
        <div class="help-item">
          <h4>实时协作</h4>
          <p>顶栏绿点表示实时连接正常。其他玩家保存价格后，你正在查看的城池会立即刷新；若该行你也有未保存修改，会标记「已被他人更新」，保存时提示冲突，可选覆盖或改用最新数据。</p>
        </div>
        <div class="help-item">
          <h4>定时自动同步</h4>
          <p>「定时」可配置 cron 频率、区服、更新人与 token（存于当前账号并绑定定时同步），服务器按北京时间自动同步，并保留最近运行记录；也可随时点「立即同步一次」。</p>
        </div>
        <div class="help-item">
          <h4>报表</h4>
          <p>「报表」提供涨跌幅榜、跨城池套利建议（按载重计算可购件数与毛利）与改价/同步热度图。</p>
        </div>
        <div class="help-item">
          <h4>批量导入</h4>
          <p>「导入」支持 Excel（.xlsx，先「下载模板」按「商品 | 买价 | 卖价 | 负重」填写后上传）；可勾选合并模式，只更新有值字段、不清空另一侧已有价格。</p>
        </div>
        <div class="help-item">
          <h4>快捷键</h4>
          <p>Ctrl / Cmd + Enter 快速保存；Tab 在各输入框间顺序移动；Esc 关闭弹窗。区服、城池/商品下拉框均支持一键清空。</p>
        </div>
        <div class="help-item">
          <h4>日志 / 趋势 / 比价</h4>
          <p>「日志」查看改价前后值与操作人；「趋势」看某商品价格曲线；「比价」看同一商品在所有城池的价格，并可跳转套利报表。</p>
        </div>
        <div class="help-item">
          <h4>负重与利润</h4>
          <p>每个商品有负重（如谷物10、兵器52）；利润按跨城计算：「比价」中选卖出城后，利润 =（卖出城卖价 − 买入城买价）÷ 负重，自动推荐最优买卖路线。</p>
        </div>
      </div>
    </el-card>

  </main>

  <!-- 手机端底部保存条 -->
  <div class="mobile-savebar" v-if="isMobile">
    <span class="stat">已修改 <b>{{ changedCount }}</b> 项</span>
    <el-button type="primary" :disabled="!canSave" @click="onSave">保存价格</el-button>
  </div>

  <!-- ================= 保存确认弹窗 ================= -->
  <el-dialog v-model="saveVisible" title="确认更新价格" width="680px" :fullscreen="isMobile" top="8vh">
    <div class="confirm-summary">
      将保存 <b>{{ form.server }}</b> · <b>{{ form.city }}</b> 的 <b>{{ changedRows.length }}</b> 条价格：
    </div>
    <div class="confirm-list" v-if="changedRows.length">
      <el-table :data="changedRows" size="small">
<el-table-column label="商品" prop="commodity" min-width="100"></el-table-column>
        <el-table-column label="负重" width="60" align="right">
          <template #default="s">{{ s.row.burden ?? '-' }}</template>
        </el-table-column>
        <el-table-column label="买价（原 → 新）" min-width="140">
          <template #default="s">
            <span :class="{ 'danger-tag': !s.row.buy && s.row._baseBuy !== '-' }">
              {{ s.row._baseBuy || '-' }} → {{ s.row.buy || '-' }}
            </span>
          </template>
        </el-table-column>
        <el-table-column label="卖价（原 → 新）" min-width="140">
          <template #default="s">
            <span :class="{ 'danger-tag': !s.row.sell && s.row._baseSell !== '-' }">
              {{ s.row._baseSell || '-' }} → {{ s.row.sell || '-' }}
            </span>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="70" align="center">
          <template #default="s">
            <el-tag size="small" :type="rowOpType(s.row)" effect="plain">{{ rowOpText(s.row) }}</el-tag>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <el-alert v-if="conflictCount" type="warning" :closable="false" show-icon style="margin-top:10px"
      :title="`其中 ${conflictCount} 项可能已被他人更新，保存时会再次校验并提示冲突`"></el-alert>
    <template #footer>
      <el-button @click="saveVisible = false">取 消</el-button>
      <el-button type="primary" :loading="saving" @click="confirmSave">确认保存</el-button>
    </template>
  </el-dialog>

  <!-- ================= 字典管理弹窗 ================= -->
  <el-dialog v-model="dictVisible" title="字典管理" width="960px" :fullscreen="isMobile" top="6vh">
    <el-tabs v-model="dictTab">
      <el-tab-pane :label="`城池（${dictData.city.length}）`" name="city">
        <div style="display:flex;gap:8px;margin-bottom:10px">
<el-input v-model="newCity" placeholder="新城池名称" style="width:220px"
            @keyup.enter="addDictItem('city')"></el-input>
          <el-button type="primary" @click="addDictItem('city')">新增</el-button>
        </div>
        <el-table :data="dictData.city" size="small" max-height="46vh">
          <el-table-column label="城池名称" min-width="150">
            <template #default="s">
<el-input v-model="s.row._draft" size="small" @change="saveDictRename(s.row)" @blur="saveDictRename(s.row)"></el-input>
            </template>
          </el-table-column>
          <el-table-column label="启用" width="70" align="center">
            <template #default="s">
<el-switch v-model="s.row.status" :active-value="1" :inactive-value="0" @change="toggleDict(s.row)"></el-switch>
            </template>
          </el-table-column>
          <el-table-column label="价格引用" width="90" align="center">
            <template #default="s">{{ s.row.city_used }}</template>
          </el-table-column>
          <el-table-column label="操作" width="150" align="center">
            <template #default="s">

      <el-select v-model="trendCommodity" filterable placeholder="选择商品" style="width:170px"

<el-option v-for="c in commodities" :key="c.id" :label="c.name" :value="c.name"></el-option>
      </el-select>

<el-option label="近 7 天" :value="7"></el-option>

<el-option label="近 90 天" :value="90"></el-option>

    </div>

    <div v-if="!queried" class="confirm-summary">请先在上方选择区服与城池并查询。</div>
    <template v-else>
      <div class="confirm-summary">
        {{ form.server }} · {{ form.city }} · <b>{{ trendCommodity || '请选择商品' }}</b>

      </div>

      <!-- 汇总 -->

        <span>最新买价 <b>{{ trendData.summary.lastBuy ?? '-' }}</b></span>
        <span>最新卖价 <b>{{ trendData.summary.lastSell ?? '-' }}</b></span>
        <span>买价区间 <b>{{ trendData.summary.minBuy ?? '-' }} ~ {{ trendData.summary.maxBuy ?? '-' }}</b></span>
        <span>卖价区间 <b>{{ trendData.summary.minSell ?? '-' }} ~ {{ trendData.summary.maxSell ?? '-' }}</b></span>
        <span v-if="trendData.summary.buyChangePct != null">
          买价涨跌 <b :class="trendData.summary.buyChangePct >= 0 ? 'ok' : 'danger'">{{ trendData.summary.buyChangePct }}%</b>
        </span>
        <span v-if="trendData.summary.sellChangePct != null">
          卖价涨跌 <b :class="trendData.summary.sellChangePct >= 0 ? 'ok' : 'danger'">{{ trendData.summary.sellChangePct }}%</b>
        </span>
      </div>

      <!-- SVG 折线图（滚轮缩放 / 拖拽平移） -->
      <div class="chart-box" v-if="trendPoints.length">
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap">
          <el-button size="small" @click="zoomTrend(0.6)">放大</el-button>
          <el-button size="small" @click="zoomTrend(1.6)">缩小</el-button>
          <el-button size="small" @click="resetTrendView" :disabled="!trendChart.zoomed">重置</el-button>
          <span style="font-size:12px;color:var(--ink-2)">鼠标滚轮缩放 · 按住拖拽平移</span>
        </div>
        <svg :viewBox="'0 0 ' + trendChart.W + ' ' + trendChart.H" class="trend-svg"
          :style="{ cursor: trendDragging ? 'grabbing' : 'grab' }"
          @wheel.prevent="onTrendWheel"
          @mousedown="onTrendMouseDown"
          @mousemove="onTrendMouseMove"
          @mouseup="onTrendMouseUp"
          @mouseleave="onTrendMouseUp">
          <!-- 横向网格线 -->
          <line v-for="g in trendChart.grid" :key="'g' + g.y" :x1="36" :x2="trendChart.W - 10"
            :y1="g.y" :y2="g.y" stroke="#e6e3dc" stroke-dasharray="4 4" />
          <text v-for="g in trendChart.grid" :key="'gl' + g.y" :x="32" :y="g.y + 4"
            text-anchor="end" font-size="11" fill="#6b7280">{{ g.label }}</text>
          <!-- 买价线 -->
          <path v-if="trendChart.buyPath" :d="trendChart.buyPath" fill="none"
            stroke="#2563eb" stroke-width="2.5" />
          <!-- 卖价线 -->
          <path v-if="trendChart.sellPath" :d="trendChart.sellPath" fill="none"
            stroke="#ea580c" stroke-width="2.5" />
          <!-- 数据点 -->
          <circle v-for="(d, idx) in trendChart.buyDots" :key="'bd' + idx" :cx="d.x" :cy="d.y" r="3"
            fill="#2563eb"><title>{{ d.tip }}</title></circle>
          <circle v-for="(d, idx) in trendChart.sellDots" :key="'sd' + idx" :cx="d.x" :cy="d.y" r="3"
            fill="#ea580c"><title>{{ d.tip }}</title></circle>
          <!-- X 轴标签（日期+时间） -->
          <text v-for="l in trendChart.xLabels" :key="'x' + l.x + l.label" :x="l.x" :y="trendChart.H - 6"
            :text-anchor="l.anchor" font-size="11" fill="#6b7280">{{ l.label }}</text>
        </svg>
        <div class="chart-legend">
          <span class="legend-dot" style="background:#2563eb"></span>买价
          <span class="legend-dot" style="background:#ea580c"></span>卖价
          <span style="margin-left:12px;color:var(--ink-2);font-size:12px">
            共 {{ trendPoints.length }} 个数据点，悬停查看明细
          </span>
        </div>
      </div>
      <div v-else class="empty-tip" style="padding:18px">该时间范围内暂无价格变更记录</div>
    </template>
    <template #footer>
      <el-button @click="trendVisible = false">关 闭</el-button>
    </template>
  </el-dialog>

          <el-input v-model="settings.token" type="textarea" :rows="3"
            placeholder="粘贴 x-game-token-pcweb；留空表示清除本账号 token"></el-input>
          <div class="hint-line" v-if="settings.tokenOwner && settings.tokenOwner === nickname">定时同步使用本账号 token（仅本账号可见）。</div>
          <div class="hint-line" v-else-if="settings.tokenOwner">当前定时同步使用 <b>{{ settings.tokenOwner }}</b> 的 token（其他账号的 token 不可见）；保存本账号 token 后将改绑。</div>
          <div class="hint-line" v-else-if="settings.legacyToken">当前使用旧版共享 token；保存本账号 token 后将改绑且共享 token 失效。</div>
          <div class="hint-line" v-else>尚未保存 token，启用自动同步前必须填写（仅本账号可见）。</div>
        </el-form-item>
      </el-form>
      <div class="statusbar" style="margin-bottom:10px">
        <span>上次运行 <b>{{ settings.lastRunAt || '-' }}</b></span>
        <span>状态 <b :class="settings.lastStatus === 'failed' ? 'danger' : 'ok'">{{ settings.lastStatus || '-' }}</b></span>
        <span v-if="settings.lastMessage">{{ settings.lastMessage }}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:6px 0 10px">
        <b style="font-size:13px">最近运行记录</b>
        <div style="flex:1"></div>
        <el-button size="small" :loading="settingsRunning" @click="runSettingsSync">立即同步一次</el-button>
      </div>
      <el-table :data="syncLogs" size="small" max-height="30vh">
        <el-table-column label="开始时间" prop="startedAt" width="150"></el-table-column>
        <el-table-column label="触发" width="70" align="center">
          <template #default="s">{{ s.row.triggerType === 'cron' ? '定时' : s.row.triggerType === 'cli' ? 'CLI' : '手动' }}</template>
        </el-table-column>
        <el-table-column label="区服" prop="server" width="90" align="center"></el-table-column>
        <el-table-column label="状态" width="80" align="center">
          <template #default="s">
            <el-tag size="small" effect="plain"
              :type="s.row.status === 'success' ? 'success' : s.row.status === 'partial' ? 'warning' : s.row.status === 'running' ? 'info' : 'danger'">
              {{ s.row.status }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="查询/写入" width="100" align="center">
          <template #default="s">{{ s.row.queried ?? '-' }} / {{ s.row.saved ?? '-' }}</template>
        </el-table-column>
        <el-table-column label="失败城数" width="80" align="center">
          <template #default="s">{{ s.row.failedCount ?? 0 }}</template>
        </el-table-column>
        <el-table-column label="说明" prop="message" min-width="140" show-overflow-tooltip></el-table-column>
      </el-table>
    </div>
    <template #footer>
      <el-button @click="settingsVisible = false">关 闭</el-button>
      <el-button type="primary" :loading="settingsSaving" @click="saveSettings">保存设置</el-button>
    </template>
  </el-dialog>

  <!-- ================= 数据报表弹窗 ================= -->
  <el-dialog v-model="reportVisible" title="数据报表" width="1020px" :fullscreen="isMobile" top="5vh">
    <div class="report-toolbar">
      <el-input v-model="reportServer" placeholder="区服，如 1344" style="width:150px"
        @keyup.enter="loadReport"></el-input>
      <el-button :loading="reportLoading" @click="loadReport">刷新</el-button>
    </div>
    <el-tabs v-model="reportTab" @tab-change="onReportTabChange">
      <!-- 涨跌幅榜 -->
      <el-tab-pane label="涨跌幅榜" name="movers">
        <div class="report-toolbar">
          <el-select v-model="reportDays" style="width:120px" @change="loadReport">
            <el-option label="近 7 天" :value="7"></el-option>
            <el-option label="近 30 天" :value="30"></el-option>
            <el-option label="近 90 天" :value="90"></el-option>
          </el-select>
          <span class="hint-line">按涨跌幅绝对值降序，对比窗口起点与当前库内价格</span>
        </div>
        <el-table :data="moversData.items" size="small" max-height="52vh" border stripe>
          <el-table-column label="城池" prop="city" width="90"></el-table-column>
          <el-table-column label="商品" prop="commodity" min-width="100"></el-table-column>
          <el-table-column label="字段" width="70" align="center">
            <template #default="s">{{ s.row.field === 'buy' ? '买价' : '卖价' }}</template>
          </el-table-column>
          <el-table-column label="起始" width="80" align="right">
            <template #default="s">{{ s.row.start }}</template>
          </el-table-column>
          <el-table-column label="当前" width="80" align="right">
            <template #default="s">{{ s.row.end }}</template>
          </el-table-column>
          <el-table-column label="涨跌" width="90" align="right">
            <template #default="s">
              <b :class="changeClass(s.row.change)">{{ s.row.change > 0 ? '+' : '' }}{{ s.row.change }}</b>
            </template>
          </el-table-column>
          <el-table-column label="涨跌幅" width="90" align="right">
            <template #default="s">
              <b :class="changeClass(s.row.changePct)">{{ s.row.changePct > 0 ? '+' : '' }}{{ s.row.changePct }}%</b>
            </template>
          </el-table-column>
          <el-table-column label="更新时间" prop="updatedAt" width="150"></el-table-column>
          <template #empty>该时间范围内暂无价格变更记录</template>
        </el-table>
      </el-tab-pane>

      <!-- 城池间套利 -->
      <el-tab-pane label="套利建议" name="arbitrage">
        <div class="report-toolbar">
          <span class="param-label">载重</span>
          <el-input-number v-model="arbParams.load" :min="1" :max="100000" size="small"
            controls-position="right" style="width:110px"></el-input-number>
          <el-checkbox v-model="arbParams.all">含亏损路线</el-checkbox>
          <el-button size="small" @click="loadReport">计算</el-button>
        </div>
        <el-table :data="arbData.items" size="small" max-height="50vh" border stripe>
          <el-table-column label="商品" prop="commodity" width="90"></el-table-column>
          <el-table-column label="路线" min-width="130">
            <template #default="s">
              <b class="ok">{{ s.row.buyCity }}</b> → <b class="ok">{{ s.row.sellCity }}</b>
            </template>
          </el-table-column>
          <el-table-column label="买价" prop="buyPrice" width="75" align="right"></el-table-column>
          <el-table-column label="卖价" prop="sellPrice" width="75" align="right"></el-table-column>
          <el-table-column label="单位利润" width="90" align="right">
            <template #default="s">
              <b :class="changeClass(s.row.unitProfit)">{{ s.row.unitProfit > 0 ? '+' : '' }}{{ s.row.unitProfit }}</b>
            </template>
          </el-table-column>
          <el-table-column label="件数" prop="units" width="65" align="right"></el-table-column>
          <el-table-column label="毛利" width="90" align="right">
            <template #default="s"><b :class="changeClass(s.row.gross)">{{ s.row.gross }}</b></template>
          </el-table-column>
          <template #empty>暂无可计算的套利路线，请先同步或录入更多城池价格</template>
        </el-table>
      </el-tab-pane>

      <!-- 更新热度 -->
      <el-tab-pane label="更新热度" name="heat">
        <div class="report-toolbar">
          <el-select v-model="heatBucket" style="width:110px" @change="loadReport">
            <el-option label="按天" value="day"></el-option>
            <el-option label="按小时" value="hour"></el-option>
          </el-select>
          <el-select v-model="heatDays" style="width:120px" @change="loadReport">
            <el-option label="近 7 天" :value="7"></el-option>
            <el-option label="近 30 天" :value="30"></el-option>
            <el-option label="近 90 天" :value="90"></el-option>
          </el-select>
          <span class="hint-line">改价 <b>{{ heatData.totalChanges }}</b> 次 · 同步 <b>{{ heatData.totalSyncs }}</b> 次</span>
        </div>
        <div v-if="heatData.buckets.length" class="heat-bars">
          <div class="heat-col" v-for="b in heatBars" :key="b.key"
            :title="`${b.label}：改价 ${b.changes} 次，同步 ${b.syncs} 次，${b.users} 人参与`">
            <div class="heat-track">
              <div class="heat-bar" :style="{ height: b.height + '%' }"></div>
            </div>
            <div class="heat-label" v-if="b.showLabel">{{ b.label }}</div>
          </div>
        </div>
        <div v-else class="empty-tip">暂无更新数据</div>
      </el-tab-pane>
    </el-tabs>
    <template #footer>
      <el-button @click="reportVisible = false">关 闭</el-button>
    </template>
  </el-dialog>

  </template>
</div>

<script src="/vendor/xlsx/xlsx.full.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
